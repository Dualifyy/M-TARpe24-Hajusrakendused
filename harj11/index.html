<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vestlusruum</title>
</head>
<body>
    <form name="publish">
        <input type="text" name="message" maxlength="50" placeholder="message">
        <input type="text" name="username" maxlength="16" placeholder="username">
        <input type="submit" value="Saada">
    </form>
    <div id="messages"></div>
    <script>
        let protocol = location.protocol === 'https:' ? 'wss:' : 'ws:'
        let url = `${protocol}//${location.host}/ws`

        let socket = new WebSocket(url)

        document.forms.publish.onsubmit = function() {
            socket.send(this.username.value+": "+this.message.value)
            return false
        }

        socket.onmessage = function(event) {
            let messageElement = document.createElement("div")
            messageElement.textContent = event.data
            document.getElementById("messages").append(messageElement)
        }

        socket.onclose = event => console.log("Closed", event.code)
    </script>
</body>
</html>
