<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button type="button" onclick="loadDoc()">Request Bacon</button>
    <p id="demo"></p>

    <script>
        function loadDoc() {
        const xhttp = new XMLHttpRequest() 
            xhttp.onload = function () {
                const data = this.responseText
                const response = JSON.parse(data)
                const facts = response.data.map(item => `<li>${item.fact}</li>`)
                let dataHtml = "<ol>"
                    for (const fact of facts)
                {
                    dataHtml += fact
                }
                dataHtml += "<ol>"

                    document.getElementById("demo").innerHTML = dataHtml
            }
            xhttp.open("GET", "https://catfact.ninja/facts");
            xhttp.send();
            document.getElementById("demo").innerHTML = "load cat fact plz wait"
        }
    </script>
</body>
</html>
