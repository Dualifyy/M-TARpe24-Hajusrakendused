<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button type="button" onclick="loadDoc()">Get buzzwords</button>
    <p id="demo"></p>

    <script>
        
        function loadDoc() {
        const xhttp = new XMLHttpRequest();
            xhttp.onload = function () {
                document.getElementById("demo").innerHTML = this.responseText;
            }
            xhttp.open("GET", "https://corporatebs-generator.sameerkumar.website/");
            xhttp.send();
            document.getElementById("demo").innerHTML = "loading buzzwords"
        }
    </script>
</body>
</html>
